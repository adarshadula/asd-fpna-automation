name: Refresh FP&A data (Databricks stand-in)

# In production, this transform-and-load step would run as a scheduled
# Databricks job reading from the real data warehouse. For this portfolio
# demo, a scheduled GitHub Actions workflow plays the same role: run the
# pipeline, refresh the numbers, and let the hosting provider (Netlify/
# Vercel, connected to this repo) pick up the change and redeploy
# automatically -- no manual step in between.

on:
  schedule:
    - cron: "0 6 * * *"   # once a day, 6am UTC
  workflow_dispatch: {}     # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dateutil

      - name: Run pipeline and sync dashboard data
        run: python3 pipeline/run_pipeline.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "fpna-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ dashboard/src/data/
          git diff --quiet --cached || git commit -m "Automated data refresh"
          git push
